name: CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Security, Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 12

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript types
        run: pnpm typecheck

      - name: Verify production security audit
        run: pnpm audit --prod

      - name: Verify zero critical vulnerabilities in dev tooling
        run: pnpm audit --audit-level=critical

      - name: Run Unit & Accessibility Tests
        run: pnpm test

      - name: Build Library Bundle
        run: pnpm build

      - name: Build Storybook Documentation
        run: pnpm build-storybook

      - name: Verify Package Tarball
        run: pnpm pack
